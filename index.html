<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="دورهٔ کامل و عملی هشت‌هفته‌ای وب: npm، Vite، Tailwind CSS، JavaScript، API، آزمون، TypeScript و انتشار پروژهٔ پایانی."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="کارگاه کدنویسی | دورهٔ کامل وب" />
    <meta
      property="og:description"
      content="از اولین فرمان تا وب‌سایتی که می‌توانی منتشر کنی: هشت هفته درس عملی، تمرین، آزمون و چک‌لیست."
    />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>کارگاه کدنویسی | از ابزار تا وب‌سایت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var storedTheme = localStorage.getItem('code-workshop-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          storedTheme === 'dark' || storedTheme === 'light'
            ? storedTheme
            : prefersDark
              ? 'dark'
              : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body class="bg-slate-50 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
